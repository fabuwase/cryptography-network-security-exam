
# Cryptography & Network Security Project
# Firewall Configuration - Authorised Laboratory Environment

# Laboratory network definitions
STUDENT_RECORDS_SERVER=192.168.10.10
GUEST_NETWORK=192.168.20.0/24
STAFF_NETWORK=192.168.30.0/24

# Protected service
PROTECTED_SERVICE=SSH
PROTECTED_PORT=22
PROTOCOL=TCP

# Firewall policy
# 1. Block guest network access to the student records server.
BLOCK GUEST_NETWORK -> STUDENT_RECORDS_SERVER

# 2. Permit authorised staff network access to the protected service.
ALLOW STAFF_NETWORK -> STUDENT_RECORDS_SERVER:22/TCP

# 3. Block other inbound access to the protected service.
BLOCK OTHER_SOURCES -> STUDENT_RECORDS_SERVER:22/TCP

# Default policy for inbound traffic
DEFAULT_INBOUND_POLICY=DROP